sonar.projectKey=capacitor-appodeal
sonar.projectName=Capacitor Appodeal
sonar.host.url=http://127.0.0.1:9000
# El token NO va aquí: se lee de la variable de entorno SONAR_TOKEN o del archivo local .env

sonar.sources=src,android/src/main/java
sonar.tests=test,android/src/test/java
sonar.test.inclusions=test/**/*.test.cjs,android/src/test/java/**/*Test.java
sonar.exclusions=node_modules/**,dist/**,coverage/**,android/build/**,android/.gradle/**,android/gradle/**
sonar.java.binaries=android/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=android/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.coverage.exclusions=src/definitions.ts
sonar.cpd.exclusions=src/definitions.ts
sonar.sourceEncoding=UTF-8

# Ignorar falso positivo en definitions.ts: NON_SKIPPABLE_VIDEO y REWARDED_VIDEO comparten el valor 128 por especificación del SDK de Appodeal
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6578
sonar.issue.ignore.multicriteria.e1.resourceKey=src/definitions.ts
