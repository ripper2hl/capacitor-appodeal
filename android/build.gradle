def resolveAdapterList = { String propName ->
    def raw = null
    if (rootProject.ext.has(propName)) {
        raw = rootProject.ext.get(propName)
    } else if (project.hasProperty(propName)) {
        raw = project.property(propName)
    }
    if (raw == null) {
        return null
    }
    if (raw instanceof Collection) {
        return raw.collect { it.toString().trim() }.findAll { !it.isEmpty() } as Set<String>
    }
    return raw.toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() } as Set<String>
}

def includedOverride = resolveAdapterList('appodealIncludedAdapters')
def excludedOverride = resolveAdapterList('appodealExcludedAdapters')
def extraOverride = resolveAdapterList('appodealExtraAdapters')

Set<String> activeAdapters = new LinkedHashSet<>(
    includedOverride != null ? includedOverride : defaultIncludedAdapters
)
if (extraOverride != null) {
    activeAdapters.addAll(extraOverride)
}
if (excludedOverride != null) {
    activeAdapters.removeAll(excludedOverride)
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    // Appodeal Core SDK 4.x
    implementation "com.appodeal.ads.sdk:core:$appodealCoreVersion"

    // Selected Appodeal Network Adapters
    activeAdapters.each { String adapterName ->
        def coordinate = appodealAdapterCatalog[adapterName]
        if (coordinate != null) {
            implementation coordinate
        } else {
            logger.warn("[capacitor-appodeal] Unknown adapter '${adapterName}' in configuration. Available: ${appodealAdapterCatalog.keySet()}")
        }
    }

    // BidMachine network bridges (when 'bidmachine' is active)
    if (activeAdapters.contains('bidmachine')) {
        bidmachineBridges.each { String netName, String coordinate ->
            if (activeAdapters.contains(netName)) {
                implementation coordinate
            }
        }
    }

    // Bidon network bridges (when 'bidon' is active)
    if (activeAdapters.contains('bidon')) {
        bidonBridges.each { String netName, String coordinate ->
            if (activeAdapters.contains(netName) || netName == 'zmaticoo') {
                implementation coordinate
            }
        }
    }

    // AppLovin MAX network bridges (when 'applovin_max' is active)
    if (activeAdapters.contains('applovin_max')) {
        applovinMaxBridges.each { String netName, List<String> coordinates ->
            if (activeAdapters.contains(netName)) {
                coordinates.each { String coordinate ->
                    implementation coordinate
                }
            }
        }
    }

    // LevelPlay network bridges (when 'level_play' is active)
    if (activeAdapters.contains('level_play')) {
        levelPlayBridges.each { String netName, String coordinate ->
            if (activeAdapters.contains(netName)) {
                implementation coordinate
            }
        }
    }

    // Google Play Console Fix: Force Billing Library 8.0.0+ for August 2026 Policy
    implementation "com.android.billingclient:billing:8.0.0"
}
